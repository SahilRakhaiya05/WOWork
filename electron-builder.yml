appId: com.opencowork.app
productName: OpenCowork
copyright: Copyright © 2025 OpenCowork Contributors

directories:
  output: dist-electron

files:
  - main.js
  - preload.js
  - dist/**/*
  - src/main/**/*
  - skills/**/*
  - "!**/*.map"
  - "!**/node_modules/.cache"

mac:
  target:
    - dmg
    - zip
  icon: build/icon.icns
  category: public.app-category.productivity
  hardenedRuntime: true

win:
  target:
    - nsis
    - portable
  icon: build/icon.ico

linux:
  target:
    - AppImage
  icon: build/icon.png
  category: Utility

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

publish:
  provider: github
  owner: opencowork
  repo: opencowork
